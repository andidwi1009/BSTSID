local function setDropOpen(state)
    dropOpen = state
    TweenService:Create(dropContainer, TweenInfo.new(0.2, Enum.EasingStyle.Quad, Enum.EasingDirection.Out), {
        Size = dropOpen and UDim2.new(0.95, 0, 0, 192) or UDim2.new(0.95, 0, 0, 36)
    }):Play()
    dropStroke.Transparency = dropOpen and 0.3 or 0.8
    dropArrow.Text = dropOpen and "▲" or "▼"
end

dropBtn.MouseButton1Click:Connect(function()
    setDropOpen(not dropOpen)
end)

local function filterPlayers(query)
    local cleanQuery = query:lower()
    for plr, btn in pairs(playerButtons) do
        local nameMatch = plr.Name:lower():find(cleanQuery) ~= nil
        local displayMatch = plr.DisplayName:lower():find(cleanQuery) ~= nil
        btn.Visible = nameMatch or displayMatch
    end
end

searchBox:GetPropertyChangedSignal("Text"):Connect(function()
    filterPlayers(searchBox.Text)
end)

local function setTarget(plr)
    targetPlayer = plr
    isFollowing = false
    isTruckFollowing = false
    
    if plr then
        dropLabel.Text = "Target: " .. plr.Name
        targetStatusDot.BackgroundColor3 = Theme.On
    else
        dropLabel.Text = "Target: (Belum Dipilih)"
        targetStatusDot.BackgroundColor3 = Theme.Off
    end

    setDropOpen(false)

    for otherPlr, btn in pairs(playerButtons) do
        local isSelected = (otherPlr == plr)
        btn.BackgroundColor3 = isSelected and Theme.PanelHov or Theme.TitleBg
        local textLbl = btn:FindFirstChild("TextLabel")
        if textLbl then
            textLbl.TextColor3 = isSelected and Theme.Text or Color3.fromRGB(190, 190, 205)
        end
    end
end

local function createPlayerButton(plr)
    local pBtn = Instance.new("TextButton")
    pBtn.Name = "Btn_" .. plr.Name
    pBtn.Size = UDim2.new(1, 0, 0, 28)
    pBtn.BackgroundColor3 = (plr == targetPlayer) and Theme.PanelHov or Theme.TitleBg
    pBtn.Text = ""
    pBtn.AutoButtonColor = false
    pBtn.Parent = dropScroll
    Instance.new("UICorner", pBtn).CornerRadius = UDim.new(0, 6)

    local pLabel = Instance.new("TextLabel")
    pLabel.Size = UDim2.new(1, -12, 1, 0)
    pLabel.Position = UDim2.new(0, 8, 0, 0)
    pLabel.BackgroundTransparency = 1
    pLabel.Text = plr.DisplayName .. " (@" .. plr.Name .. ")"
    pLabel.TextColor3 = (plr == targetPlayer) and Theme.Text or Color3.fromRGB(190, 190, 205)
    pLabel.Font = Enum.Font.Gotham
    pLabel.TextSize = 12
    pLabel.TextXAlignment = Enum.TextXAlignment.Left
    pLabel.TextTruncate = Enum.TextTruncate.AtEnd
    pLabel.Parent = pBtn

    pBtn.MouseEnter:Connect(function()
        if plr ~= targetPlayer then
            pBtn.BackgroundColor3 = Theme.Panel
            pLabel.TextColor3 = Theme.Text
        end
    end)
    pBtn.MouseLeave:Connect(function()
        if plr ~= targetPlayer then
            pBtn.BackgroundColor3 = Theme.TitleBg
            pLabel.TextColor3 = Color3.fromRGB(190, 190, 205)
        end
    end)
    pBtn.MouseButton1Click:Connect(function()
        setTarget(plr)
    end)

    playerButtons[plr] = pBtn
end

local function removePlayerButton(plr)
    local btn = playerButtons[plr]
    if btn then
        btn:Destroy()
        playerButtons[plr] = nil
    end
    if targetPlayer == plr then
        setTarget(nil)
        dropLabel.Text = "Target: (Player Out)"
    end
end

for _, plr in ipairs(Players:GetPlayers()) do
    if plr ~= LocalPlayer then
        createPlayerButton(plr)
    end
end

Players.PlayerAdded:Connect(function(plr)
    if plr ~= LocalPlayer then
        createPlayerButton(plr)
    end
end)

Players.PlayerRemoving:Connect(function(plr)
    removePlayerButton(plr)
end)

