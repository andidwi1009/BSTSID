local function getTruckTypeName(truck)
    for typeName in pairs(truckBedConfig) do
        if truck.Name:sub(1, #typeName) == typeName then
            return typeName
        end
    end
    return truck.Name:match("^(.-)_%d") or truck.Name
end

local function findPromptsIn(folder)
    local items = {}
    if not folder then return items end
    for _, desc in ipairs(folder:GetDescendants()) do
        if desc:IsA("ProximityPrompt") then
            table.insert(items, {part = desc.Parent, prompt = desc})
        end
    end
    return items
end

