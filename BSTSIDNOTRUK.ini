-- ============================================================
-- Teleport helpers
-- ============================================================

local function safeTeleport(targetCFrame)
    local char = LocalPlayer.Character
    if not char or not char:FindFirstChild("HumanoidRootPart") or not targetCFrame then return end

    local hrp = char.HumanoidRootPart
    local startPos = hrp.Position
    local targetPos = targetCFrame.Position
    local distance = (targetPos - startPos).Magnitude

    local stepDistance = 150
    local steps = math.ceil(distance / stepDistance)
    if steps < 1 then steps = 1 end

    for i = 1, steps do
        if not autoFarmRunning and not autoFarmXP_Running and not LocalPlayer.Character then break end
        if not LocalPlayer.Character or not LocalPlayer.Character:FindFirstChild("HumanoidRootPart") then break end

        local alpha = i / steps
        local nextPos = startPos:Lerp(targetPos, alpha)

        hrp.CFrame = CFrame.new(nextPos)
        task.wait(0.15)
    end
end

local function safeTeleportToMoving(getTargetCFrame)
    local char = LocalPlayer.Character
    if not char or not char:FindFirstChild("HumanoidRootPart") then return end
    local hrp = char.HumanoidRootPart

    local stepDistance = 150
    local maxSteps = 40

    for _ = 1, maxSteps do
        if not autoFarmRunning and not autoFarmXP_Running then break end
        if not LocalPlayer.Character or not LocalPlayer.Character:FindFirstChild("HumanoidRootPart") then break end

        local targetCFrame = getTargetCFrame()
        if not targetCFrame then return end

        local currentPos = hrp.Position
        local targetPos = targetCFrame.Position
        local distance = (targetPos - currentPos).Magnitude

        if distance <= stepDistance then
            hrp.CFrame = CFrame.new(targetPos)
            return
        end

        local direction = (targetPos - currentPos).Unit
        hrp.CFrame = CFrame.new(currentPos + direction * stepDistance)
        task.wait(0.15)
    end
end

local function resolveCFrame(target)
    if target == nil then return nil end
    local t = typeof(target)
    if t == "CFrame" then
        return target
    elseif t == "Vector3" then
        return CFrame.new(target)
    elseif t == "Instance" then
        if target:IsA("BasePart") then
            return target.CFrame
        elseif target:IsA("Model") then
            local ok, cf = pcall(function() return target:GetPivot() end)
            if ok then return cf end
        elseif target:FindFirstChild("Position") then
            return CFrame.new(target.Position.Value)
        end
    end
    return nil
end

local function fireProximityPrompt(prompt)
    if not prompt or not prompt:IsA("ProximityPrompt") then return false end
    if typeof(fireproximityprompt) ~= "function" then
        warn("[JobAutoHUD] Executor kamu ga nyediain fireproximityprompt(), auto-load ga bisa jalan")
        return false
    end
    return pcall(function()
        fireproximityprompt(prompt)
    end)
end

