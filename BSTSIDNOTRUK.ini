local gasPumpPaths = {
    {"gas station 3", "Red Gas Pump Handle 2"},
    {"gas station 3", "Red Gas Pump Handle 3"},
    {"gas station", "Red Gas Pump Handle"},
    {"gas station", "Red Gas Pump Handle 4"},
    {"gas station 4", "Red Gas Pump Handle 5"},
    {"gas station 4", "Red Gas Pump Handle 6"},
}

local function findNozzlePrompt(pumpHandle)
    if not pumpHandle then return nil end
    for _, desc in ipairs(pumpHandle:GetDescendants()) do
        if desc.Name == "NozzlePrompt" and desc:IsA("ProximityPrompt") then
            return desc
        end
    end
    return nil
end

local function findNearestGasPump()
    local char = LocalPlayer.Character
    local hrp = char and char:FindFirstChild("HumanoidRootPart")
    if not hrp then return nil end

    local nearestPrompt, nearestDist = nil, math.huge

    for _, path in ipairs(gasPumpPaths) do
        local ok, handle = pcall(function() return workspace[path[1]][path[2]] end)
        if ok and handle then
            local prompt = findNozzlePrompt(handle)
            if prompt then
                local cf = resolveCFrame(prompt.Parent)
                if cf then
                    local dist = (cf.Position - hrp.Position).Magnitude
                    if dist < nearestDist then
                        nearestDist = dist
                        nearestPrompt = prompt
                    end
                end
            end
        end
    end

    return nearestPrompt
end

local function getTruckFuelPercent(truck)
    local maxFuel = truck:GetAttribute("MaxFuel") or 100
    local fuelLevel = truck:GetAttribute("FuelLevel") or maxFuel
    return math.floor(math.clamp(fuelLevel / maxFuel, 0, 1) * 100)
end

local REFUEL_LOW_THRESHOLD = 20
local REFUEL_DONE_THRESHOLD = 50

local function ejectFromSeat()
    local char = LocalPlayer.Character
    local humanoid = char and char:FindFirstChildOfClass("Humanoid")
    if not humanoid then return end
    humanoid.Jump = true
    task.wait(0.3)
    humanoid.Sit = false
end

-- ============================================================
-- RETURN TO SEAT (DENGAN ANTI-MALING & AUTO-LOCK GUARD)
-- ============================================================
local ToggleLock = TruckSpawnerRemotes:WaitForChild("ToggleLock")

local function returnToSeat(driveSeat)
    if not driveSeat or not driveSeat.Parent then return false end

    local char = LocalPlayer.Character
    local humanoid = char and char:FindFirstChildOfClass("Humanoid")
    if not humanoid then return false end

    local truck = driveSeat:FindFirstAncestorWhichIsA("Model")

    -- 1. PERCOBAAN 1-3: DUDUK NORMAL
    for attempt = 1, 3 do
        if not autoFarmRunning then return false end

        safeTeleport(resolveCFrame(driveSeat))
        driveSeat:Sit(humanoid)
        task.wait(0.3)

        if humanoid.SeatPart == driveSeat then
            return true
        end
    end

    -- 2. GUARD AKTIF: GAGAL 3X = DIMALING!
    warn("[JobAutoHUD] GAGAL 3X DUDUK! Truk dimaling. Mengaktifkan Anti-Maling Guard...")

    local isLocked = truck and truck:GetAttribute("Locked") == true

    if not isLocked then
        print("[JobAutoHUD] Memaksa kunci mobil via Remote ToggleLock...")
        ToggleLock:FireServer()
        task.wait(0.5)
    end

    local seatPrompt = driveSeat:FindFirstChildOfClass("ProximityPrompt") 
        or (driveSeat.Parent and driveSeat.Parent:FindFirstChildOfClass("ProximityPrompt"))

    local retryAttempts = 0
    while autoFarmRunning and humanoid.SeatPart ~= driveSeat and retryAttempts < 10 do
        safeTeleport(resolveCFrame(driveSeat))
        
        if char:FindFirstChild("HumanoidRootPart") then
            char.HumanoidRootPart.CFrame = resolveCFrame(driveSeat)
        end
        
        task.wait(0.2)

        if seatPrompt then
            fireProximityPrompt(seatPrompt)
        else
            for _, desc in ipairs(driveSeat:GetDescendants()) do
                if desc:IsA("ProximityPrompt") then
                    fireProximityPrompt(desc)
                    break
                end
            end
        end

        task.wait(0.5)
        retryAttempts += 1
    end

    return humanoid.SeatPart == driveSeat
end

local noclipEnabled = false

local function autoRefuelIfNeeded()
    if not autoFarmRunning then return end

    local truck = getMyTruck()
    if not truck then return end

    local percent = getTruckFuelPercent(truck)
    if percent > REFUEL_LOW_THRESHOLD then return end

    local char = LocalPlayer.Character
    local humanoid = char and char:FindFirstChildOfClass("Humanoid")
    local hrp = char and char:FindFirstChild("HumanoidRootPart")
    local driveSeat = truck:FindFirstChild("DriveSeat")
    local isSeated = humanoid ~= nil and driveSeat ~= nil and humanoid.SeatPart == driveSeat

    if not isSeated or not hrp then return end

    print("[JobAutoHUD] Bensin " .. percent .. "%, mulai isi bensin")

    local nozzlePrompt = findNearestGasPump()
    if not nozzlePrompt then
        warn("[JobAutoHUD] Ga nemu SPBU manapun buat isi bensin")
        return
    end

    local nozzleCFrame = resolveCFrame(nozzlePrompt.Parent)
    if not nozzleCFrame then return end

    local truckType = getTruckTypeName(truck)
    local tankResolver = truckTankConfig[truckType]
    if not tankResolver then
        warn("[JobAutoHUD] Posisi tangki truk '" .. truckType .. "' belum dikonfigurasi")
        return
    end

    teleportModel(truck, nozzleCFrame)
    ejectFromSeat()

    local originalNoclip = noclipEnabled
    local fuelIncreased = false
    local loopAttempt = 1
    local activeRefuelFlyVel = nil

    while autoFarmRunning and not fuelIncreased and loopAttempt <= 20 and truck.Parent do
        print("[JobAutoHUD] Refuel Attempt #" .. loopAttempt .. ": TP ke Nozzle & Fire Proximity...")
        
        safeTeleport(nozzleCFrame)
        hrp.CFrame = nozzleCFrame
        task.wait(0.2)
        fireProximityPrompt(nozzlePrompt)
        task.wait(0.8)

        if not autoFarmRunning then break end

        local tankPart = tankResolver(truck)
        local tankCFrame = resolveCFrame(tankPart)

        if not tankCFrame then
            warn("[JobAutoHUD] Part tangki belum ke-stream, nembak ke bodi truk dulu...")
            tankCFrame = resolveCFrame(driveSeat) or resolveCFrame(truck)
        end

        if tankCFrame then
            noclipEnabled = true
            
            if activeRefuelFlyVel then activeRefuelFlyVel:Destroy() end
            activeRefuelFlyVel = Instance.new("BodyVelocity")
            activeRefuelFlyVel.Name = "RefuelFlyVel"
            activeRefuelFlyVel.MaxForce = Vector3.new(1e9, 1e9, 1e9)
            activeRefuelFlyVel.Velocity = Vector3.new(0, 0, 0)
            activeRefuelFlyVel.Parent = hrp

            print("[JobAutoHUD] Fly & TP ke Tangki Truk...")
            safeTeleport(tankCFrame)
            hrp.CFrame = tankCFrame

            if humanoid and humanoid.Sit then
                warn("[JobAutoHUD] Avatar nyangkut di seat pas TP ke tangki! Memaksa lompat keluar...")
                humanoid.Jump = true
                task.wait(0.2)
                humanoid.Sit = false
            end

            local initialFuel = getTruckFuelPercent(truck)
            local spinConnection
            local angle = 0

            spinConnection = RunService.RenderStepped:Connect(function(dt)
                if hrp and hrp.Parent then
                    angle = (angle + math.rad(360) * dt) % (math.pi * 2)
                    local currentPos = hrp.Position
                    hrp.CFrame = CFrame.new(currentPos) * CFrame.Angles(0, angle, 0)
                end
            end)

            local checkTime = 0
            while autoFarmRunning and checkTime < 3 do
                task.wait(0.5)
                checkTime += 0.5

                local currentPercent = getTruckFuelPercent(truck)
                if currentPercent > initialFuel then
                    fuelIncreased = true
                    print("[JobAutoHUD] Bensin bertambah! Mematikan rotasi, FLY TETAP AKTIF sampai 100%.")
                    break
                end
            end

            if spinConnection then spinConnection:Disconnect() end
        else
            warn("[JobAutoHUD] Bodi/Tangki truk bener-bener ga ketemu!")
        end

        if not fuelIncreased then
            warn("[JobAutoHUD] Bensin belum bertambah! Mengulang TP ke Nozzle...")
            if activeRefuelFlyVel then activeRefuelFlyVel:Destroy() activeRefuelFlyVel = nil end
            noclipEnabled = originalNoclip
            loopAttempt += 1
            task.wait(0.3)
        end
    end

    if autoFarmRunning and fuelIncreased then
        local maxWait = 60
        local waited = 0
        while autoFarmRunning and waited < maxWait do
            if not truck.Parent or getTruckFuelPercent(truck) >= 100 then
                print("[JobAutoHUD] Bensin sudah 100% / Penuh!")
                break
            end
            
            if activeRefuelFlyVel and hrp then
                activeRefuelFlyVel.Velocity = Vector3.new(0, 0, 0)
            end
            
            task.wait(1)
            waited += 1
        end
    end

    if activeRefuelFlyVel then 
        activeRefuelFlyVel:Destroy() 
        activeRefuelFlyVel = nil
    end
    noclipEnabled = originalNoclip

    if autoFarmRunning then
        print("[JobAutoHUD] Bensin sekarang: " .. getTruckFuelPercent(truck) .. "%. Kembali ke Seat...")
        returnToSeat(driveSeat)
    end
end

