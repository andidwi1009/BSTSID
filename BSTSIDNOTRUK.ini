local function formatRupiah(n)
    local sign = n < 0 and "-" or ""
    return sign .. tostring(math.floor(math.abs(n))):reverse():gsub("(%d%d%d)", "%1."):reverse():gsub("^%.", "")
end

local function getCurrentRupiah()
    local leaderstats = LocalPlayer:FindFirstChild("leaderstats")
    local rupiah = leaderstats and leaderstats:FindFirstChild("Rupiah")
    return (rupiah and rupiah.Value) or 0
end

