local function spawnAndWaitForTruck(config)
    if not autoFarmRunning then return nil end

    -- Ambil daftar truk yang valid untuk muatan ini
    local validTrucks = config.validTrucks
    if not validTrucks or #validTrucks == 0 then return nil end

    local spawnedTruck = nil

    -- Loop mencoba setiap truk yang valid sampai ada yang berhasil keluar
    for _, truckName in ipairs(validTrucks) do
        if not autoFarmRunning then break end

        print("[JobAutoHUD] Mencoba spawn truk: " .. truckName)
        
        -- Hapus truk lama jika ada
        pcall(function() RemoveTrucks:FireServer() end)
        task.wait(0.5)

        -- Panggil remote spawn
        pcall(function() SpawnTruck:FireServer(truckName) end)

        -- Tunggu sebentar untuk mengecek apakah truk berhasil muncul
        local waited = 0
        while autoFarmRunning and waited < 3 do
            spawnedTruck = getMyTruck({truckName})
            if spawnedTruck then
                break
            end
            task.wait(0.5)
                waited += 0.5
        end

        -- Jika truk berhasil muncul, keluar dari loop
        if spawnedTruck then
            print("[JobAutoHUD] ✅ Berhasil spawn truk milikmu: " .. truckName)
            break
        else
            warn("[JobAutoHUD] ⚠️ Truk '" .. truckName .. "' tidak dimiliki / gagal spawn. Skipping ke opsi berikutnya...")
        end
    end

    return spawnedTruck
end

local function isTruckNearLocation(truck, targetCFrame, maxDistance)
    if not truck or not targetCFrame then return false end
    local truckCF = resolveCFrame(truck)
    if not truckCF then return false end
    
    local distance = (truckCF.Position - targetCFrame.Position).Magnitude
    return distance <= (maxDistance or 30)
end

-- 1. OVERRIDE BOOTSTRAP AUTO FARM (Hanya untuk Pupuk & Cargo Lainnya)
local function bootstrapAutoFarm(cargoName)
    if not autoFarmRunning then return false end
    local config = cargoConfig[cargoName]
    if not config then return false end

    local fallbackCFrame = pickupFallbackCFrame[cargoName]
    
    if fallbackCFrame then
        print("[JobAutoHUD] 📍 TP Avatar ke lokasi pickup " .. cargoName .. "...")
        safeTeleport(fallbackCFrame)
        task.wait(1)
    end

    if not autoFarmRunning then return false end

    -- Cek apakah sudah ada truk milikmu di tempat
    local myTruck = getMyTruck(config.validTrucks)
    
    if fallbackCFrame and myTruck then
        if not isTruckNearLocation(myTruck, fallbackCFrame, 30) then
            print("[JobAutoHUD] ⚠️ Truk berada > 30 stud dari area pickup. Respawn truk yang dimiliki...")
            myTruck = spawnAndWaitForTruck(config)
        end
    elseif not myTruck then
        print("[JobAutoHUD] Belum ada truk valid di tempat, mencari truk yang dimiliki...")
        myTruck = spawnAndWaitForTruck(config)
    end

    if not myTruck then
        warn("[JobAutoHUD] ❌ Tidak ada truk yang dimiliki untuk muatan " .. cargoName .. "! Auto farm dibatalkan.")
        return false
    end

    return true
end

-- ============================================================
-- AUTO FARM XP (SAPI FAST LOOP - FAST OVERRIDE METHOD)
-- ============================================================
local function spawnTruckForXP(validTrucks)
    if not autoFarmXP_Running then return nil end

    local truckName = validTrucks[math.random(1, #validTrucks)]
    print("[JobAutoHUD] Memaksa spawn " .. truckName .. " baru (otomatis timpa truk lama)...")
    
    pcall(function() SpawnTruck:FireServer(truckName) end)

    local newTruck = nil
    local waited = 0
    while autoFarmXP_Running and not newTruck and waited < 15 do
        newTruck = getMyTruck(validTrucks)
        if not newTruck then
            task.wait(0.3)
            waited += 0.3
        end
    end

    return newTruck
end

local function runAutoFarmXP_Sapi()
    local config = cargoConfig["Sapi"]
    if not config then return end

    print("[JobAutoHUD] Auto Farm XP (Sapi Fast Loop + Retry Guard) Dimulai!")

    while autoFarmXP_Running do
        local myTruck = getMyTruck(config.validTrucks)
        if not myTruck then
            myTruck = spawnTruckForXP(config.validTrucks)
        end

        if not autoFarmXP_Running or not myTruck then
            warn("[JobAutoHUD] Gagal spawn/menemukan L300! Mengulang loop...")
            task.wait(1)
            continue
        end

        local items = config.pickupItems()
        if #items == 0 then
            warn("[JobAutoHUD] Item Sapi/Jerami ga ketemu, tunggu streaming...")
            task.wait(1)
        else
            for _, item in ipairs(items) do
                if not autoFarmXP_Running then break end
                
                safeTeleport(resolveCFrame(item.part))
                task.wait(0.2)
                fireProximityPrompt(item.prompt)
                
                local startWait = os.clock()
                while autoFarmXP_Running and (os.clock() - startWait) < 2 do
                    local activeCargo = myTruck:FindFirstChild("ActiveCargo")
                    if activeCargo and item.slotName and activeCargo:FindFirstChild(item.slotName) then
                        break
                    end
                    task.wait(0.2)
                end
            end
        end

        if not autoFarmXP_Running then break end

        local deliverySuccess = false
        local maxDeliveryAttempts = 5

        for attempt = 1, maxDeliveryAttempts do
            if not autoFarmXP_Running or not myTruck.Parent then break end

            print(string.format("[JobAutoHUD] Teleport Truk ke Pengiriman Sapi (Percobaan %d/%d)...", attempt, maxDeliveryAttempts))
            
            teleportModel(myTruck, config.delivery)
            
            local startCheck = os.clock()
            while autoFarmXP_Running and (os.clock() - startCheck) < 3 do
                local activeCargo = myTruck:FindFirstChild("ActiveCargo")
                
                if not activeCargo or not config.isFull(activeCargo) then
                    deliverySuccess = true
                    deliveryCount += 1
                    print("[JobAutoHUD] ✅ Pengiriman Sapi Berhasil! XP / Money Diterima.")
                    break
                end
                task.wait(0.3)
            end

            if deliverySuccess then break end
            
            warn("[JobAutoHUD] ⚠️ Truk nyangkut / Pengiriman belum terdeteksi. Mencoba TP ulang...")
            task.wait(0.5)
        end

        if not autoFarmXP_Running then break end

        if deliverySuccess or not myTruck.Parent then
            print("[JobAutoHUD] Memaksa spawn L300 baru untuk siklus berikutnya...")
            spawnTruckForXP(config.validTrucks)
            task.wait(0.5)
        else
            warn("[JobAutoHUD] Gagal menyelesaikan pengiriman setelah retry. Resetting loop...")
            pcall(function() RemoveTrucks:FireServer() end)
            task.wait(1)
        end
    end

    autoFarmXP_Running = false
    print("[JobAutoHUD] Auto Farm XP Berhenti sepenuhnya.")
end

local function runAutoFarm(cargoName)
    local config = cargoConfig[cargoName]
    if not config then
        autoFarmRunning = false
        return
    end

    while autoFarmRunning do
        autoRefuelIfNeeded()
        if not autoFarmRunning then break end

        local delivered = runOneFarmCycle(cargoName)
        if not autoFarmRunning then break end
        if not delivered then
            warn("[JobAutoHUD] Cycle " .. cargoName .. " gagal, auto farm berhenti")
            break
        end

        ejectFromSeat()

        local fallbackCFrame = pickupFallbackCFrame[cargoName]
        if fallbackCFrame then
            safeTeleport(fallbackCFrame)
            task.wait(1)
        end

        if not autoFarmRunning then break end

        local items = config.pickupItems()
        if items[1] then
            safeTeleport(resolveCFrame(items[1].part))
        end

        local newTruck = spawnAndWaitForTruck(config)

        if not autoFarmRunning or not newTruck then break end
        task.wait(0.5)
    end

    autoFarmRunning = false
    print("[JobAutoHUD] Auto Farm telah berhenti sepenuhnya.")
end

-- Double Farm (Pupuk + Pakan Ternak)
local function runDoubleFarmCycle()
    if not autoFarmRunning then return false end

    local pupukConfig = cargoConfig["Pupuk"]
    local pakanConfig = cargoConfig["Pakan Ternak"]

    local validTrucks = {}
    for _, t in ipairs(pupukConfig.validTrucks) do
        for _, t2 in ipairs(pakanConfig.validTrucks) do
            if t == t2 then table.insert(validTrucks, t) end
        end
    end
    if #validTrucks == 0 then return false end

    local myTruck = getMyTruck(validTrucks)
    if not myTruck then return false end

    local truckType = getTruckTypeName(myTruck)
    local bedResolver = truckBedConfig[truckType]
    if not bedResolver then return false end

    local bedPart = nil
    for i = 1, 20 do
        if not autoFarmRunning then return false end
        bedPart = bedResolver(myTruck)
        if bedPart then break end
        task.wait(0.3)
    end
    if not bedPart then return false end

    local function getBedCFrame() return resolveCFrame(bedPart) end
    local function getActiveCargo() return myTruck:FindFirstChild("ActiveCargo") end
    local function pupukFull()
        local ac = getActiveCargo()
        return ac ~= nil and pupukConfig.isFull(ac)
    end
    local function pakanFull()
        local ac = getActiveCargo()
        return ac ~= nil and pakanConfig.isFull(ac)
    end

    local function isCarryingPakan()
        local admin = workspace:FindFirstChild("AdminDatangSC")
        if not admin then return false end
        for _, child in ipairs(admin:GetChildren()) do
            if child.Name:sub(1, #pakanConfig.carryFlag) == pakanConfig.carryFlag then
                return true
            end
        end
        return false
    end

    local function depositPakanAtBed()
        local maxAttempts = 10
        for attempt = 1, maxAttempts do
            if not autoFarmRunning then return false end
            safeTeleportToMoving(getBedCFrame)
            if waitUntil(function() return not isCarryingPakan() end, 1) then
                return true
            end
        end
        return false
    end

    local function doPupukPickup(item)
        local maxAttempts = 10
        for attempt = 1, maxAttempts do
            if not autoFarmRunning then return end
            safeTeleport(resolveCFrame(item.part))
            task.wait(0.15)
            fireProximityPrompt(item.prompt)

            local success
            if item.slotName then
                success = waitUntil(function()
                    local ac = getActiveCargo()
                    return ac ~= nil and ac:FindFirstChild(item.slotName) ~= nil
                end, 1)
            else
                success = waitUntil(pupukFull, 1)
            end
            if success then return end
        end
    end

    local function doPakanPickup(item)
        local maxAttempts = 10
        local carrying = false
        for attempt = 1, maxAttempts do
            if not autoFarmRunning then return end
            safeTeleport(resolveCFrame(item.part))
            task.wait(0.15)
            fireProximityPrompt(item.prompt)
            carrying = waitUntil(isCarryingPakan, 1)
            if carrying then break end
        end

        if carrying then
            depositPakanAtBed()
        else
            task.wait(0.5)
            depositPakanAtBed()
        end
    end

    local safetyLimit = 300
    local loops = 0

    while autoFarmRunning and not (pupukFull() and pakanFull()) and loops < safetyLimit do
        autoRefuelIfNeeded()
        if not autoFarmRunning then break end

        if not pupukFull() then
            local items = pupukConfig.pickupItems()
            for _, item in ipairs(items) do
                if not autoFarmRunning or pupukFull() then break end
                doPupukPickup(item)
                loops += 1
            end
        end

        if autoFarmRunning and not pakanFull() then
            local pakanItems = pakanConfig.pickupItems()
            if pakanItems[1] then
                doPakanPickup(pakanItems[1])
                loops += 1
            end
        end

        task.wait(0.2)
    end

    if not autoFarmRunning then return false end

    local driveSeat = myTruck:FindFirstChild("DriveSeat")
    if not driveSeat then return false end

    local char = LocalPlayer.Character
    local humanoid = char and char:FindFirstChildOfClass("Humanoid")
    if humanoid then
        driveSeat:Sit(humanoid)
        task.wait(0.5)
    end

    autoRefuelIfNeeded()

    local deliveredPupuk = false
    for attempt = 1, 15 do
        teleportModel(myTruck, pupukConfig.delivery)
        deliveredPupuk = waitUntil(function() return not pupukFull() end, 2)
        if deliveredPupuk then break end
    end

    if not deliveredPupuk then return false end

    local deliveredPakan = false
    for attempt = 1, 15 do
        teleportModel(myTruck, pakanConfig.delivery)
        deliveredPakan = waitUntil(function() return not pakanFull() end, 2)
        if deliveredPakan then break end
    end

    if deliveredPakan then
        deliveryCount += 1
    end

    return deliveredPakan
end

local function bootstrapDoubleFarm()
    if not autoFarmRunning then return false end
    
    local pupukFallback = pickupFallbackCFrame["Pupuk"]
    
    if pupukFallback then
        print("[JobAutoHUD] 📍 TP Avatar ke lokasi Pupuk (Double Farm)...")
        safeTeleport(pupukFallback)
        task.wait(1)
    end

    if not autoFarmRunning then return false end

    local validTrucks = {"BESI TUA"}
    local myTruck = getMyTruck(validTrucks)
    
    if pupukFallback and myTruck then
        if not isTruckNearLocation(myTruck, pupukFallback, 30) then
            print("[JobAutoHUD] ⚠️ Truk Double Farm > 30 stud dari Pupuk. Spawning ulang...")
            myTruck = spawnAndWaitForTruck({validTrucks = validTrucks})
        end
    elseif not myTruck then
        myTruck = spawnAndWaitForTruck({validTrucks = validTrucks})
    end

    return myTruck ~= nil
end

local function runDoubleFarm()
    while autoFarmRunning do
        autoRefuelIfNeeded()
        if not autoFarmRunning then break end

        local delivered = runDoubleFarmCycle()
        if not autoFarmRunning or not delivered then break end

        ejectFromSeat()

        local fallbackCFrame = pickupFallbackCFrame["Pupuk"]
        if fallbackCFrame then
            safeTeleport(fallbackCFrame)
            task.wait(1)
        end

        if not autoFarmRunning then break end

        local pupukItems = cargoConfig["Pupuk"].pickupItems()
        if pupukItems[1] then
            safeTeleport(resolveCFrame(pupukItems[1].part))
        end

        local newTruck = spawnAndWaitForTruck({validTrucks = {"BESI TUA"}})

        if not autoFarmRunning or not newTruck then break end
        task.wait(0.5)
    end

    autoFarmRunning = false
    print("[JobAutoHUD] Double Farm telah berhenti sepenuhnya.")
end

