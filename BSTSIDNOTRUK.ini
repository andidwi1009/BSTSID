local function getOwnerDisplayName(userId)
    if not userId then return "Ga Diketahui" end
    local player = Players:GetPlayerByUserId(userId)
    if player then return player.Name end
    return "Player_" .. tostring(userId)
end

local function clearTruckVisual(truck)
    local v = truckVisuals[truck]
    if v then
        if v.Highlight then v.Highlight:Destroy() end
        if v.Label then v.Label:Destroy() end
        truckVisuals[truck] = nil
    end
end

local function applyTruckESP(truck)
    if not truckESPEnabled or truckVisuals[truck] then return end

    local ownerId = truck:GetAttribute("OwnerUserId")
    local isMine = (ownerId == LocalPlayer.UserId)

    local highlight = Instance.new("Highlight")
    highlight.Name = "OwnershipESP"
    highlight.FillColor = isMine and Color3.fromRGB(0, 255, 120) or Color3.fromRGB(255, 60, 60)
    highlight.OutlineColor = highlight.FillColor
    highlight.FillTransparency = 0.75
    highlight.OutlineTransparency = 0
    highlight.Parent = truck

    local anchorPart = truck.PrimaryPart or truck:FindFirstChildWhichIsA("BasePart", true) or truck

    local label = Instance.new("BillboardGui")
    label.Name = "OwnershipLabel"
    label.Size = UDim2.new(0, 170, 0, 30)
    label.StudsOffset = Vector3.new(0, 3.5, 0)
    label.AlwaysOnTop = true
    label.Adornee = anchorPart
    label.Parent = truck

    local text = Instance.new("TextLabel")
    text.BackgroundTransparency = 1
    text.Size = UDim2.new(1, 0, 1, 0)
    text.Font = Enum.Font.GothamBold
    text.TextSize = 14
    text.TextStrokeTransparency = 0.3
    text.TextColor3 = isMine and Color3.fromRGB(0, 255, 120) or Color3.fromRGB(255, 100, 100)
    text.Text = isMine and "🟢 TRUK KAMU" or ("🔴 " .. getOwnerDisplayName(ownerId))
    text.Parent = label

    truckVisuals[truck] = {Highlight = highlight, Label = label}

    local ownerConnection
    ownerConnection = truck:GetAttributeChangedSignal("OwnerUserId"):Connect(function()
        local newOwnerId = truck:GetAttribute("OwnerUserId")
        local nowMine = (newOwnerId == LocalPlayer.UserId)
        highlight.FillColor = nowMine and Color3.fromRGB(0, 255, 120) or Color3.fromRGB(255, 60, 60)
        highlight.OutlineColor = highlight.FillColor
        text.TextColor3 = nowMine and Color3.fromRGB(0, 255, 120) or Color3.fromRGB(255, 100, 100)
        text.Text = nowMine and "🟢 TRUK KAMU" or ("🔴 " .. getOwnerDisplayName(newOwnerId))
    end)

    truck.AncestryChanged:Connect(function(_, parent)
        if not parent then 
            if ownerConnection then ownerConnection:Disconnect() end
            clearTruckVisual(truck) 
        end
    end)
end

local function refreshAllTruckESP()
    for truck in pairs(truckVisuals) do clearTruckVisual(truck) end
    if not truckESPEnabled then return end
    for _, truck in ipairs(CollectionService:GetTagged("PlayerSpawnedTruck")) do
