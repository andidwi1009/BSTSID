createToggle("Fly", false, function(state)
    flying = state
    local char = LocalPlayer.Character
    if not (flying and char and char:FindFirstChild("HumanoidRootPart")) then
        return
    end

    local hrp = char.HumanoidRootPart

    local bv = Instance.new("BodyVelocity")
    bv.Name = "FlyVelocity"
    bv.MaxForce = Vector3.new(1e9, 1e9, 1e9)
    bv.Velocity = Vector3.new(0, 0, 0)
    bv.Parent = hrp

    task.spawn(function()
        while flying and hrp.Parent do
            local cam = workspace.CurrentCamera
            local moveDir = Vector3.new(0, 0, 0)

            if flyKeysHeld[Enum.KeyCode.W] then moveDir += cam.CFrame.LookVector end
            if flyKeysHeld[Enum.KeyCode.S] then moveDir -= cam.CFrame.LookVector end
            if flyKeysHeld[Enum.KeyCode.A] then moveDir -= cam.CFrame.RightVector end
            if flyKeysHeld[Enum.KeyCode.D] then moveDir += cam.CFrame.RightVector end
            if flyKeysHeld[Enum.KeyCode.Space] then moveDir += Vector3.new(0, 1, 0) end
            if flyKeysHeld[Enum.KeyCode.LeftControl] then moveDir -= Vector3.new(0, 1, 0) end

            if moveDir.Magnitude > 0 then
                bv.Velocity = moveDir.Unit * flySpeed
            else
                bv.Velocity = Vector3.new(0, 0, 0)
            end

            task.wait()
        end
        bv:Destroy()
    end)
end)

