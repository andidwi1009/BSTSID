local function autoLockTruck()
    local myTruck = getMyTruck()
    if myTruck then
        local isLocked = myTruck:GetAttribute("Locked") == true
        if not isLocked then
            print("[DexterHUB] Mengunci truk otomatis untuk Trolling Guard...")
            pcall(function()
                ToggleLockRemote:FireServer()
            end)
        end
    end
end

