-- FITUR 1: AVATAR ORBIT + SPIN 360°
--------------------------------------------------
createToggle("Avatar Orbit + Spin 360° Target", false, function(state)
    isFollowing = state
    
    if state then
        autoLockTruck()
    end

    local myChar = LocalPlayer.Character
    local humanoid = myChar and myChar:FindFirstChildOfClass("Humanoid")
    if humanoid and not state then
        humanoid.AutoRotate = true
    end
end)

RunService.RenderStepped:Connect(function()
    if isFollowing and targetPlayer and targetPlayer.Character then
        local myChar = LocalPlayer.Character
        local humanoid = myChar and myChar:FindFirstChildOfClass("Humanoid")
        local myHRP = myChar and myChar:FindFirstChild("HumanoidRootPart")
        local targetHRP = targetPlayer.Character:FindFirstChild("HumanoidRootPart")
        
        if myHRP and targetHRP then
            if humanoid and humanoid.AutoRotate then humanoid.AutoRotate = false end
            
            local radius = 1.5
            local orbitSpeed = tick() * 5
            local spinSpeed = tick() * 15
            
            local offsetX = math.cos(orbitSpeed) * radius
            local offsetZ = math.sin(orbitSpeed) * radius
            local spinRotation = CFrame.Angles(0, spinSpeed, 0)
            
            myHRP.CFrame = (targetHRP.CFrame * CFrame.new(offsetX, 0, offsetZ)) * spinRotation
        end
    end
end)

--------------------------------------------------
-- FITUR 2: TRUK NEMPEL & SPIN (DENGAN AUTO LOCK)
--------------------------------------------------
createToggle("Truk Nempel + Spin di Target", false, function(state)
    isTruckFollowing = state
    
    if state then
        autoLockTruck()
    end
end)

RunService.RenderStepped:Connect(function()
    if not isTruckFollowing or not targetPlayer then return end

    local targetChar = targetPlayer.Character
    if not targetChar then return end

    local targetHRP = targetChar:FindFirstChild("HumanoidRootPart")
    local targetHum = targetChar:FindFirstChildOfClass("Humanoid")

    if not targetHRP or (targetHum and targetHum.Health <= 0) then return end

    local myTruck = getMyTruck()
    if not myTruck or not myTruck.Parent then return end

    local targetPos = targetHRP.Position
    local safePosY = math.max(targetPos.Y + 3, -50)
    local adjustedPosition = Vector3.new(targetPos.X, safePosY, targetPos.Z)

    local speed = tick() * 10
    local spinRotation = CFrame.Angles(0, speed, 0)

    myTruck:PivotTo(CFrame.new(adjustedPosition) * spinRotation)
end)



