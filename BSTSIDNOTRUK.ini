local autoCloseNotifEnabled = true

local function forceCloseNotif(notifInstance)
    if not notifInstance or not autoCloseNotifEnabled then return end

    if notifInstance:IsA("GuiObject") then
        notifInstance.Visible = false
    end

    for _, desc in ipairs(notifInstance:GetDescendants()) do
        if desc:IsA("GuiButton") and (desc.Name:lower():find("close") or desc.Name:lower():find("x") or desc.Name:lower():find("batal")) then
            pcall(function()
                if typeof(firesignal) == "function" then
                    firesignal(desc.MouseButton1Click)
                    firesignal(desc.Activated)
                end
            end)
            pcall(function()
                for _, conn in ipairs(getconnections(desc.MouseButton1Click)) do conn:Fire() end
                for _, conn in ipairs(getconnections(desc.Activated)) do conn:Fire() end
            end)
        end
    end
end

