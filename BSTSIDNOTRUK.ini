local function getMyTruck(validTypes)
    for _, truck in ipairs(CollectionService:GetTagged("PlayerSpawnedTruck")) do
        if truck:GetAttribute("OwnerUserId") == LocalPlayer.UserId then
            if not validTypes then return truck end
            for _, t in ipairs(validTypes) do
                if truck.Name:sub(1, #t) == t then
                    return truck
                end
            end
        end
    end
    return nil
end

local function teleportModel(model, targetCFrame)
    if not model or not targetCFrame then return end
    local ok, currentCFrame = pcall(function() return model:GetPivot() end)
    if not ok then return end

    local distance = (targetCFrame.Position - currentCFrame.Position).Magnitude
    local steps = math.max(1, math.ceil(distance / 150))

    for i = 1, steps do
        if not model.Parent then break end
        local nextCFrame = currentCFrame:Lerp(targetCFrame, i / steps)
        model:PivotTo(nextCFrame)
        task.wait(0.15)
    end
end

local function waitUntil(conditionFn, timeoutSec)
    local waited = 0
    while not conditionFn() do
        if not autoFarmRunning and not autoFarmXP_Running then return false end
        task.wait(0.1)
        waited += 0.1
        if waited >= (timeoutSec or 3) then return false end
    end
    return true
end

local function findChildByPrefix(container, prefix)
    if not container then return nil end
    for _, child in ipairs(container:GetChildren()) do
        if child.Name:sub(1, #prefix) == prefix then
            return child
        end
    end
    return nil
end

