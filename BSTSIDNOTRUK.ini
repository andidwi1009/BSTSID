local function runOneFarmCycle(cargoName)
    if not autoFarmRunning then return false end

    local config = cargoConfig[cargoName]
    if not config then
        warn("[JobAutoHUD] Cargo '" .. cargoName .. "' belum dikonfigurasi")
        return false
    end

    local myTruck = getMyTruck(config.validTrucks)
    if not myTruck then
        warn("[JobAutoHUD] Truk yg valid buat " .. cargoName .. " (" .. table.concat(config.validTrucks, "/") .. ") ga ketemu")
        return false
    end

    local truckType = getTruckTypeName(myTruck)
    print("[JobAutoHUD] Truk kepilih: '" .. myTruck.Name .. "' -> tipe terdeteksi: '" .. truckType .. "'")

    local function isFullSafe()
        local activeCargo = myTruck:FindFirstChild("ActiveCargo")
        if not activeCargo then return false end
        return config.isFull(activeCargo)
    end

    local function hasSlot(slotName)
        local activeCargo = myTruck:FindFirstChild("ActiveCargo")
        return activeCargo ~= nil and activeCargo:FindFirstChild(slotName) ~= nil
    end

    local doPickupCycle

    if config.usesBed then
        local bedResolver = truckBedConfig[truckType]
        if not bedResolver then
            warn("[JobAutoHUD] Posisi bak buat truk '" .. truckType .. "' belum dikonfigurasi di truckBedConfig")
            return false
        end

        local bedPart = nil
        for i = 1, 20 do
            if not autoFarmRunning then return false end
            bedPart = bedResolver(myTruck)
            if bedPart then break end
            task.wait(0.3)
        end
        if not bedPart then
            warn("[JobAutoHUD] Part bak truk '" .. truckType .. "' ga ketemu")
            return false
        end

        local function getBedCFrame()
            return resolveCFrame(bedPart)
        end

        if not getBedCFrame() then return false end

        local function isCarrying()
            local admin = workspace:FindFirstChild("AdminDatangSC")
            if not admin then return false end
            for _, child in ipairs(admin:GetChildren()) do
                if child.Name:sub(1, #config.carryFlag) == config.carryFlag then
                    return true
                end
            end
            return false
        end

        local function depositAtBed()
            local maxAttempts = 10
            for attempt = 1, maxAttempts do
                if not autoFarmRunning then return false end
                safeTeleportToMoving(getBedCFrame)
                if waitUntil(function() return not isCarrying() end, 1) then
                    return true
                end
            end
            return false
        end

        doPickupCycle = function(item)
            local maxAttempts = 10
            local carrying = false

            for attempt = 1, maxAttempts do
                if not autoFarmRunning then return end
                safeTeleport(resolveCFrame(item.part))
                task.wait(0.15)
                fireProximityPrompt(item.prompt)
                carrying = waitUntil(isCarrying, 1)
                if carrying then break end
            end

            if carrying then
                if not depositAtBed() then
                    warn("[JobAutoHUD] Masih kegendong abis 10x coba naro ke bak")
                end
            else
                task.wait(0.5)
                depositAtBed()
            end
        end
    else
        doPickupCycle = function(item)
            local maxAttempts = 10
            for attempt = 1, maxAttempts do
                if not autoFarmRunning then return end
                safeTeleport(resolveCFrame(item.part))
                task.wait(0.15)
                fireProximityPrompt(item.prompt)

                local success
                if item.slotName then
                    success = waitUntil(function() return hasSlot(item.slotName) end, 1)
                else
                    success = waitUntil(isFullSafe, 1)
                end

                if success then return end
            end
        end
    end

    local safetyLimit = 150
    local loops = 0

    while autoFarmRunning and not isFullSafe() and loops < safetyLimit do
        autoRefuelIfNeeded()
        if not autoFarmRunning then break end

        local items = config.pickupItems()
        if #items == 0 then
            warn("[JobAutoHUD] Item pickup buat " .. cargoName .. " ga ketemu")
            return false
        end

        for _, item in ipairs(items) do
            if not autoFarmRunning or isFullSafe() then break end
            doPickupCycle(item)
            loops += 1
        end

        task.wait(0.2)
    end

    if not autoFarmRunning then return false end

    local driveSeat = myTruck:FindFirstChild("DriveSeat")
    if not driveSeat then
        warn("[JobAutoHUD] DriveSeat ga ketemu, cargo udah full tapi ga bisa duduk")
        return false
    end

    local char = LocalPlayer.Character
    local humanoid = char and char:FindFirstChildOfClass("Humanoid")
    if humanoid then
        driveSeat:Sit(humanoid)
        task.wait(0.5)
    end

    autoRefuelIfNeeded()

    local maxDeliveryAttempts = 15
    local delivered = false

    for attempt = 1, maxDeliveryAttempts do
        teleportModel(myTruck, config.delivery)
        delivered = waitUntil(function() return not isFullSafe() end, 2)
        if delivered then break end
        warn("[JobAutoHUD] " .. cargoName .. " kesendat, TP ulang (percobaan " .. attempt .. "/" .. maxDeliveryAttempts .. ")")
    end

    if delivered then
        deliveryCount += 1
        print("[JobAutoHUD] " .. cargoName .. " berhasil di-deliver")
    else
        warn("[JobAutoHUD] " .. cargoName .. " ga kunjung ke-deliver — cek manual")
    end

    return delivered
end

